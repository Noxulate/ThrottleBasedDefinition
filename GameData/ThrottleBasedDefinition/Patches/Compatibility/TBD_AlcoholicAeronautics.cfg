@PART[aa-1,aa-3,aa-6*,aa-28]:NEEDS[AlcoholicAeronautics]:AFTER[ThrottleBasedDefinition]
{
    @MODULE[ModuleThrottleController]
    {
        %mainClass = BOOSTER // BOOSTER, SUSTAINER, ORBITAL, or DEEPSPACE
        %subClass = NONE // NONE, EXOTIC, NUCLEAR, HYBRID, AEROSPIKE, LANDER, or MANEUVER
        %minThrottle = 1.0 // 0.0-1.0
    }
}

@PART[aa-15*]:NEEDS[AlcoholicAeronautics]:AFTER[ThrottleBasedDefinition]
{
    @MODULE[ModuleThrottleController]
    {
        %mainClass = BOOSTER // BOOSTER, SUSTAINER, ORBITAL, or DEEPSPACE
        %subClass = NONE // NONE, EXOTIC, NUCLEAR, HYBRID, AEROSPIKE, LANDER, or MANEUVER
        %minThrottle = 0.25 // 0.0-1.0 
        // Based on the XLR-11. "Throttable" as each of the four (or eight for the "double") combustion chambers could be turned on and off individually
        // will proxy as 25% minThrottle
    }
}

@PART[aa-28-v]:NEEDS[AlcoholicAeronautics]:AFTER[ThrottleBasedDefinition]
{
    @MODULE[ModuleThrottleController]
    {
        %mainClass = ORBITAL // BOOSTER, SUSTAINER, ORBITAL, or DEEPSPACE
        %subClass = NONE // NONE, EXOTIC, NUCLEAR, HYBRID, AEROSPIKE, LANDER, or MANEUVER
        %minThrottle = 0.25 // 0.0-1.0
    }
}