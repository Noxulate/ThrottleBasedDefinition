@PART:HAS[@MODULE[ModuleEngines*]:HAS[~EngineType[SolidBooster],~EngineType[Turbine],~EngineType[Piston],~EngineType[Electric]],!MODULE[ModuleThrottleController]]:FOR[ThrottleBasedDefinition]
{
    MODULE 
    { 
        name = ModuleThrottleController
        mainClass = UNCLASS
        subClass = UNCLASS
        minThrottle = -1
    }
}

@PART[SSME]:NEEDS[CommunityResourcePack] // check for CRP just incase
{
    @mass = 3.7
    @MODULE[ModuleEnginesFX]
    {
        @maxThrust = 900
        @PROPELLANT[LiquidFuel]
        {
            @name = LqdHydrogen
            @ratio = 1.5
        }
        @PROPELLANT[Oxidizer] { @ratio = 0.1 }
        !atmosphereCurve {}
        atmosphereCurve
        {
            key = 0 452 0 0
            key = 1 366 0 0
            key = 4 285 0 0
        }
    }
}